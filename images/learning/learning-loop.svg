<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
<title id="title">A hierarchy for the next learning step</title><desc id="description">A lesson-selection tree branches from Task into Strategy and Knowledge, then Retrieval, Practice, Concepts and Prerequisites. A highlighted candidate passes Validation before Execution. Other branches remain visible.</desc>
